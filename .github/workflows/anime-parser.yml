name: anime-parser

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "How many latest releases to check"
        required: false
        default: "10"

permissions:
  contents: read

concurrency:
  group: anime-parser
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: anime-telegram-bot/requirements.txt
      - run: pip install -r anime-telegram-bot/requirements.txt
      - env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_USERNAME: ${{ secrets.BOT_USERNAME }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
          DB_PATH: ./anime-telegram-bot/data/actions-bot.db
        run: python -m src.parser --limit ${{ inputs.limit || 10 }}
        working-directory: anime-telegram-bot
